# PH-SSD Quick Demo Configuration (Fast 2-Epoch Verification)
model:
  name: ph_ssd
  input_dim_A: 768
  input_dim_B: 768
  d_model: 128
  d_state: 64
  z_dim: 32
  n_layers: 2
  vision_encoder: vit
  text_encoder: roberta
  pretrained: true
  num_classes: 10

dataset:
  name: flickr8k
  data_dir: data/flickr8k
  seq_len: 64
  image_size: 224
  batch_size: 16
  num_workers: 2
  max_samples: 320   # 20 batches of size 16 (~30 sec/epoch)

training:
  epochs: 2
  lr: 0.001
  weight_decay: 0.01
  warmup_epochs: 1
  use_amp: true
  use_ema: true
  max_grad_norm: 1.0

checkpoint:
  dir: checkpoints/demo
  save_every: 1
