# PH-SSD Real Experiment Configuration: VQA v2
task: visual_question_answering
model:
  name: ph_ssd
  input_dim_A: 768
  input_dim_B: 768
  d_model: 256
  d_state: 64
  z_dim: 32
  n_layers: 4
  vision_encoder: vit
  text_encoder: roberta
  pretrained: true
  num_classes: 3129

dataset:
  name: vqav2
  data_dir: data/vqav2
  seq_len: 64
  image_size: 224
  batch_size: 32
  num_workers: 4

training:
  epochs: 25
  lr: 0.0002
  weight_decay: 0.01
  warmup_epochs: 3
  use_amp: true
  use_ema: true
  max_grad_norm: 1.0

checkpoint:
  dir: checkpoints/vqav2
  save_every: 5
