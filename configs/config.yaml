# PH-SSD Master Configuration (Production 10-Epoch Image-Text Retrieval)
task: image_text_retrieval
model:
  name: ph_ssd
  input_dim_A: 768
  input_dim_B: 768
  d_model: 128
  d_embed: 128
  d_state: 64
  z_dim: 32
  n_layers: 2
  vision_encoder: vit
  text_encoder: roberta
  pretrained: true
  use_sd_npf: true
  use_vcm_ssd: true

dataset:
  name: flickr8k
  data_dir: data/flickr8k
  seq_len: 64
  image_size: 224
  batch_size: 16
  num_workers: 2
  max_samples: 0

training:
  epochs: 10
  lr: 0.0005
  weight_decay: 0.01
  warmup_epochs: 2
  kl_weight: 0.001
  use_amp: true
  use_ema: true
  max_grad_norm: 1.0

checkpoint:
  dir: checkpoints/master_production
  save_every: 1
